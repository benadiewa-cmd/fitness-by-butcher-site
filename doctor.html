<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Health report – Prodigy Fitness</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:860px;margin:0 auto;padding:20px 16px;color:#111;background:#fff;line-height:1.45}h1{color:#C42F2A;margin:.2em 0}h2{margin-top:1.6em;border-bottom:2px solid #C42F2A;padding-bottom:4px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left}th{background:#f4f4f4}.muted{color:#666;font-size:13px}.hi{color:#C42F2A;font-weight:600}.box{background:#f7f7f7;border-radius:8px;padding:10px 12px}button{background:#C42F2A;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer}@media print{button{display:none}}</style></head>
<body><img src="logo.png" alt="" width="48" height="48"><h1>Health report</h1><div id="app"><p class="muted">Loading…</p></div>
<script>
const FN="https://tlgnzfhgrfwsnppisqio.supabase.co/functions/v1/share";
const M={"total_t": ["Total testosterone", "nmol/L", 8.6, 29.0], "free_t": ["Free testosterone", "pmol/L", 200.0, 620.0], "shbg": ["SHBG", "nmol/L", 18.0, 54.0], "e2": ["Oestradiol (E2)", "pmol/L", 40.0, 160.0], "hct": ["Haematocrit", "%", 40.0, 52.0], "hb": ["Haemoglobin", "g/dL", 13.0, 17.5], "psa": ["PSA", "ng/mL", null, 4.0], "chol": ["Total cholesterol", "mmol/L", null, 5.0], "ldl": ["LDL cholesterol", "mmol/L", null, 3.0], "hdl": ["HDL cholesterol", "mmol/L", 1.0, null], "tg": ["Triglycerides", "mmol/L", null, 1.7], "alt": ["ALT (liver)", "U/L", null, 45.0], "ast": ["AST (liver)", "U/L", null, 40.0], "vitd": ["Vitamin D", "nmol/L", 75.0, 250.0], "fglu": ["Fasting glucose", "mmol/L", 3.9, 5.5], "hba1c": ["HbA1c", "%", null, 5.6], "nonhdl": ["Non-HDL cholesterol", "mmol/L", null, 3.8], "creat": ["Creatinine (kidneys)", "µmol/L", 60.0, 110.0], "egfr": ["eGFR (kidney function)", "mL/min", 60.0, null], "urate": ["Uric acid", "mmol/L", null, 0.42], "ggt": ["GGT (liver)", "U/L", null, 60.0], "tsh": ["TSH (thyroid)", "mIU/L", 0.4, 4.0], "ferritin": ["Ferritin (iron stores)", "µg/L", 30.0, 400.0], "b12": ["Vitamin B12", "pmol/L", 145.0, 569.0], "crp": ["CRP (inflammation)", "mg/L", null, 5.0], "wcc": ["White cell count", "×10⁹/L", 4.0, 11.0], "plt": ["Platelets", "×10⁹/L", 150.0, 400.0], "bp_sys": ["Blood pressure (top)", "mmHg", null, 130.0], "bp_dia": ["Blood pressure (bottom)", "mmHg", null, 85.0]};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=s=>new Date(s).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const d=s=>new Date(s+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const F={total_t:[0.3,2.4],free_t:[null,null],e2:[null,null],psa:[null,null],hct:[36,46],hb:[12,15.5],hdl:[1.2,null],ferritin:[15,150],creat:[45,90],urate:[null,0.36],ggt:[null,40],alt:[null,35],ast:[null,35]};
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
(async()=>{
  const t=new URLSearchParams(location.search).get("t")||"";
  const el=document.getElementById("app");
  try{
    const r=await fetch(FN+"?t="+encodeURIComponent(t)); const j=await r.json();
    if(j.error){el.innerHTML='<p class="box">'+esc(j.error)+'</p>';return}
    const p=j.profile||{}; let h='';
    h+='<p><b>'+esc(j.name)+'</b>'+(p.sex?' · '+esc(p.sex):'')+(p.age?' · '+esc(p.age)+' years':'')+(p.height?' · '+esc(p.height)+' cm':'')+'</p>';
    h+='<p class="muted">Shared from the Prodigy Fitness app on '+dt(j.generated_at)+'. This link works until '+dt(j.expires_at)+'. Readings are entered by the patient or synced from their devices.</p>';
    if(j.note)h+='<p class="box">'+esc(j.note)+'</p>';
    h+='<button onclick="print()">Print / save as PDF</button>';
    if(j.bp){const r30=j.bp.filter(x=>Date.now()-new Date(x.at)<30*864e5);h+='<h2>Blood pressure (90 days)</h2>';if(r30.length)h+='<p>30-day average: <b>'+esc(avg(r30.map(x=>+x.sys)))+'/'+esc(avg(r30.map(x=>+x.dia)))+' mmHg</b> from '+r30.length+' readings</p>';h+=j.bp.length?'<table><tr><th>When</th><th>mmHg</th><th>Pulse</th></tr>'+j.bp.slice(0,120).map(x=>'<tr><td>'+dt(x.at)+'</td><td class="'+(x.sys>=140||x.dia>=90?'hi':'')+'">'+esc(x.sys)+'/'+esc(x.dia)+'</td><td>'+esc(x.pulse??'')+'</td></tr>').join('')+'</table>':'<p class="muted">No readings.</p>'}
    if(j.glucose){h+='<h2>Blood glucose (90 days)</h2>';h+=j.glucose.length?'<table><tr><th>When</th><th>mmol/L</th><th>When taken</th></tr>'+j.glucose.slice(0,150).map(x=>'<tr><td>'+dt(x.at)+'</td><td>'+esc(x.mmol)+'</td><td>'+esc(x.context)+'</td></tr>').join('')+'</table>':'<p class="muted">No readings.</p>'}
    if(j.bloods){h+='<h2>Blood tests</h2>';if(!j.bloods.length)h+='<p class="muted">None recorded.</p>';const keys=[...new Set(j.bloods.flatMap(b=>Object.keys(b.results||{})))].filter(k=>M[k]);if(keys.length){h+='<table><tr><th>Marker</th>'+j.bloods.map(b=>'<th>'+d(b.date)+'</th>').join('')+'<th>Typical</th></tr>';const fem=p.sex==='Female';for(const k of keys){const[l,u,lo0,hi0]=M[k];const[lo,hi]=fem&&F[k]?F[k]:[lo0,hi0];h+='<tr><td>'+esc(l)+' <span class="muted">'+esc(u)+'</span></td>'+j.bloods.map(b=>{const v0=(b.results||{})[k];const v=typeof v0==='number'?v0:parseFloat(v0);const ok=Number.isFinite(v);const out=ok&&((lo!=null&&v<lo)||(hi!=null&&v>hi));return '<td class="'+(out?'hi':'')+'">'+(ok?esc(v):'')+'</td>'}).join('')+'<td class="muted">'+(lo!=null&&hi!=null?lo+'–'+hi:lo!=null?'≥ '+lo:hi!=null?'≤ '+hi:'')+'</td></tr>'}h+='</table><p class="muted">Typical adult '+(fem?'female':'male')+' ranges; the lab report’s own ranges take priority.</p>'}}
    if(j.medicines){h+='<h2>Current medicines</h2>';h+=j.medicines.length?'<table><tr><th>Medicine</th><th>Dose</th><th>Times</th></tr>'+j.medicines.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.dose)+'</td><td>'+esc((x.times||[]).join(', '))+'</td></tr>').join('')+'</table>':'<p class="muted">None listed.</p>'}
    if(j.weight){h+='<h2>Weight (6 months)</h2>';h+=j.weight.length?'<table><tr><th>Date</th><th>kg</th><th>Waist cm</th></tr>'+j.weight.slice(0,60).map(x=>'<tr><td>'+d(x.date)+'</td><td>'+esc(x.kg)+'</td><td>'+esc(x.waist??'')+'</td></tr>').join('')+'</table>':'<p class="muted">None recorded.</p>'}
    h+='<p class="muted" style="margin-top:2em">Prodigy Fitness is a fitness and health tracking app. This report is for information and doesn’t replace clinical measurement.</p>';
    el.innerHTML=h;
  }catch(e){el.innerHTML='<p class="box">Couldn\'t load this report. Check your internet connection and try again.</p>'}
})();
</script></body></html>
